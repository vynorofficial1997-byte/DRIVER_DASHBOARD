<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ausway - Drivers</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html" aria-label="Ausway home"><img src="assets/img/logo.png" alt=""> <span>AUSWAY</span></a>
    <label class="search"><span class="search-icon"></span><input type="search" placeholder="Search your bookings..."></label>
    <button class="profile" id="profile-toggle" aria-haspopup="dialog" aria-expanded="false"><svg class="profile-user" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle cx="20" cy="14" r="5"/><path d="M10.5 30c1.2-5 4.3-7.5 9.5-7.5s8.3 2.5 9.5 7.5"/></svg><span id="profile-display-name">Full Name</span><span class="chevron"></span></button>
    <button class="top-icon" aria-label="Notifications"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 23H7l2.2-3.1V13a6.8 6.8 0 0 1 13.6 0v6.9zM13 27a3.2 3.2 0 0 0 6 0"/><path d="M16 4V2"/></svg></button>
    <button class="top-icon gear" aria-label="Settings"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m13 3-.7 3.1a10.5 10.5 0 0 0-2.4 1.4L7 6.4l-3.1 5.3 2.3 2.2a10 10 0 0 0 0 2.8l-2.3 2.2L7 24.2l2.9-1.1a10.5 10.5 0 0 0 2.4 1.4L13 27.5h6l.7-3a10.5 10.5 0 0 0 2.4-1.4l2.9 1.1 3.1-5.3-2.3-2.2a10 10 0 0 0 0-2.8l2.3-2.2-3.1-5.3-2.9 1.1a10.5 10.5 0 0 0-2.4-1.4L19 3z"/><circle cx="16" cy="15.5" r="4.3"/></svg></button>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a class="nav-item" href="dashboard.html"><svg class="nav-icon" viewBox="0 0 28 28" aria-hidden="true"><rect x="3.5" y="4" width="8" height="6.5"/><rect x="15.5" y="4" width="9" height="9"/><rect x="3.5" y="14.5" width="9" height="9"/><rect x="16" y="17" width="8.5" height="6.5"/></svg>Dashboard</a>
        <a class="nav-item" href="trips.html"><svg class="nav-icon trip-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 11h8M3 15h6M4 19h5"/><circle cx="11" cy="23" r="3"/><circle cx="25" cy="21" r="3.5"/><path d="M14 23h7l3-9h-6M19 9h4l1 5"/></svg>Trips</a>
        <a class="nav-item active" href="drivers.html" aria-current="page"><svg class="nav-icon" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11"/><circle cx="14" cy="15" r="4" fill="currentColor"/><path d="M3.5 12.5c6-2.5 15-2.5 21 0M14 19v6"/></svg>Drivers</a>
        <a class="nav-item" href="#"><svg class="nav-icon request-icon" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 3.5h20v17H10l-6 4z"/><circle cx="14" cy="9.5" r="2.4" fill="currentColor"/><path d="M9.5 16.5c.8-3 8.2-3 9 0z" fill="currentColor"/></svg>Requests</a>
        <a class="nav-item" href="#"><svg class="nav-icon report-icon" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="14" width="5" height="11" rx=".6"/><rect x="11.5" y="4" width="5" height="21" rx=".6"/><rect x="20" y="10" width="5" height="15" rx=".6"/></svg>Reports</a>
      </nav>
    </aside>
    <main class="main-panel"><section class="welcome"><h1>Driver Management</h1><p class="crumb"><a href="dashboard.html">Dashboard</a> &gt; <b>Drivers</b></p></section><section class="filters"><label class="search"><span class="search-icon"></span><input id="q" type="search" placeholder="Search by name, email or phone..." autocomplete="off"></label><select id="rt" aria-label="Ratings"><option>All Ratings</option><option>5 Stars</option><option>4+ Stars</option><option>3+ Stars</option></select><select id="st" aria-label="Status"><option>All Status</option><option>Active</option><option>Inactive</option></select></section><section class="table-card"><table><thead><tr><th>Driver</th><th>Driver ID</th><th>Contact</th><th>Ratings</th><th>App Status</th><th>Status</th><th class="c">Actions</th></tr></thead><tbody id="rows"></tbody></table></section><div class="pager"><button aria-label="Previous">&lt;</button><button class="on">1</button><button>2</button><button>3</button><span>....</span><button>999</button><button aria-label="Next">&gt;</button></div></main>
  </div>
  <script src="assets/js/common.js"></script>
<script>
  var A = window.Ausway, $ = function (s) { return document.querySelector(s); };
  /* name, id, phone, app status, status, email, join date, rides, gender, address */
  var D = [
    ['Saravanan', 'REN2589', '+91 8946284610', 'Requested', 'Active', 'ABCjoe@gmail.com', '12 Mar 2024', '29', 'Male', 'No:76,gandhi road,villivakkam,chennai-63'],
    ['Ajay', 'AXR567', '+91 1234567890', 'Arrived', 'Inactive', 'ajay@gmail.com', '05 Jan 2024', '41', 'Male', 'No:12,anna nagar,chennai-40'],
    ['Tharun', 'DFG4298', '+91 0987654321', 'Arrived', 'Active', 'tharun@gmail.com', '20 Feb 2024', '18', 'Male', 'No:8,t nagar,chennai-17'],
    ['Dinesh', 'SAT8901', '+91 9876543210', 'Completed', 'Active', 'dinesh@gmail.com', '02 Apr 2024', '56', 'Male', 'No:33,adyar,chennai-20']
  ];
  function draw() {
    var q = $('#q').value.trim().toLowerCase(), f = $('#st').value;
    var L = D.filter(function (t) { return (!q || t.join(' ').toLowerCase().indexOf(q) > -1) && (f === 'All Status' || t[4] === f); });
    $('#rows').innerHTML = L.map(function (t) {
      var i = D.indexOf(t);
      return '<tr><td><span class="who">' + A.userIcon + A.esc(t[0]) + '</span></td><td>' + t[1] + '</td><td>' + t[2] + '</td><td></td>' +
        '<td class="s-' + t[3].toLowerCase() + '">' + t[3] + '</td><td class="s-' + t[4].toLowerCase() + '">' + t[4] + '</td><td><span class="act">' +
        '<button class="icon-btn" data-a="view" data-i="' + i + '" aria-label="View driver">' + A.viewIcon + '</button>' +
        '<button class="icon-btn" data-a="more" data-i="' + i + '" aria-label="More">' + A.moreIcon + '</button></span></td></tr>';
    }).join('') || '<tr><td colspan="7" class="empty">No drivers found</td></tr>';
  }
  function view(t) {
    A.openDetails('Driver Details', [['Driver Name:', t[0]], ['Driver ID:', t[1]], ['Email ID:', t[5]], ['Phone:', t[2]],
      ['Status:', t[4], 's-' + t[4].toLowerCase()], ['Join Date:', t[6]], ['Total Rides:', t[7]], ['Gender:', t[8]], ['Address:', t[9], '', true]]);
  }
  $('#rows').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var t = D[b.dataset.i];
    if (b.dataset.a === 'view') return view(t);
    A.menu({ stopPropagation: function () { e.stopPropagation(); }, currentTarget: b }, [
      ['Edit name', function () { var n = prompt('Driver name', t[0]); if (n && n.trim()) { t[0] = n.trim(); draw(); } }],
      [t[4] === 'Active' ? 'Deactivate' : 'Activate', function () { t[4] = t[4] === 'Active' ? 'Inactive' : 'Active'; draw(); }],
      ['Delete driver', function () { if (confirm('Delete this driver?')) { D.splice(D.indexOf(t), 1); draw(); } }, 'del']
    ]);
  });
  $('#q').addEventListener('input', draw); $('#st').addEventListener('change', draw); draw();
</script>
</body>
</html>
